<div class="max-w-3xl mx-auto py-8 px-4">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">Statuts</h2>

  <!-- Status bubbles row -->
  <div class="flex items-center gap-4 overflow-x-auto pb-2 mb-6">
    <button class="flex flex-col items-center gap-1.5 shrink-0">
      <div class="w-16 h-16 rounded-full border-2 border-dashed border-indigo-300 flex items-center justify-center bg-indigo-50 hover:bg-indigo-100 transition-colors">
        <svg class="w-6 h-6 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
      </div>
      <span class="text-xs text-gray-600 font-medium">Mon statut</span>
    </button>
    @for (s of statuses; track s.id) {
      <button class="flex flex-col items-center gap-1.5 shrink-0">
        <div class="w-16 h-16 rounded-full border-2 flex items-center justify-center text-white font-bold text-lg"
             [class.border-indigo-500]="!s.seen" [class.border-gray-300]="s.seen"
             [style.background]="s.color">{{ s.initials }}</div>
        <span class="text-xs text-gray-600 truncate max-w-16">{{ s.name }}</span>
      </button>
    }
  </div>

  <!-- Statuses list -->
  <div class="space-y-3">
    @for (s of statuses; track s.id) {
      <div class="card flex items-center gap-4 cursor-pointer hover:shadow-md transition-shadow">
        <div class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold shrink-0" [style.background]="s.color">{{ s.initials }}</div>
        <div class="flex-1 min-w-0">
          <p class="font-medium text-gray-900 text-sm">{{ s.name }}</p>
          <p class="text-xs text-gray-400">Expire dans {{ s.expires }}</p>
        </div>
        <span class="text-xs text-gray-400">{{ s.time }}</span>
      </div>
    }
  </div>
</div>
