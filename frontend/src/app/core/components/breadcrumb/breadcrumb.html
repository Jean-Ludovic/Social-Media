<nav aria-label="Fil d'Ariane" class="text-xs text-gray-400 flex items-center gap-1.5 flex-wrap">
  @for (item of items; track item.label; let last = $last) {
    @if (!last && item.link) {
      <a [routerLink]="item.link"
         class="hover:text-gray-700 hover:underline transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400 rounded">
        {{ item.label }}
      </a>
    } @else {
      <span class="text-gray-600 font-medium truncate max-w-[16rem]" [class.text-gray-600]="last">{{ item.label }}</span>
    }
    @if (!last) {
      <span aria-hidden="true">›</span>
    }
  }
</nav>
